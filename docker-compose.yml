# Stillpoint, whole, on one machine.
#
# Five containers: MySQL, PHP-FPM, the nginx in front of it, Laravel's
# scheduler, and the Next.js app. It is a working deployment and a way to run the product without a PHP
# toolchain — not a production topology, which would put the database somewhere
# it is backed up and the two apps behind a load balancer.
#
#   cp deploy/.env.example .env && $EDITOR .env   # APP_KEY is not optional
#   docker compose up --build
#   docker compose exec api php artisan migrate --force
#
# No `db:seed` here. That seeds the demo accounts, which includes an admin
# whose password is printed in this repository. deploy/README.md says how the
# first admin of a real deployment is made.
#
# Then the web app is on http://localhost:3000 and the API on
# http://localhost:8000.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stillpoint}
      MYSQL_USER: ${DB_USERNAME:-stillpoint}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    # Not published. Nothing outside this network has any business reaching the
    # database directly, and the one column worth stealing is encrypted at rest
    # precisely because something eventually will.
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    # Named so a pre-built image (CI builds all three) is reused rather than
    # rebuilt from scratch by `compose up`.
    image: stillpoint-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Stillpoint
      APP_ENV: production
      APP_DEBUG: 'false'
      # Losing this loses every journal, every session and every safety flag:
      # the encrypted casts key off it and there is no other copy. See
      # deploy/README.md.
      APP_KEY: ${APP_KEY:?set APP_KEY in .env — see deploy/README.md}
      APP_URL: ${API_URL:-http://localhost:8000}
      APP_FRONTEND_URL: ${WEB_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: ${DB_DATABASE:-stillpoint}
      DB_USERNAME: ${DB_USERNAME:-stillpoint}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stderr
      # No mail driver is chosen yet, so a password reset link is written to
      # the log rather than sent. deploy/README.md calls this out: it is the
      # one thing here that is not production-ready.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      # Passed through, because this list is all the container sees: there is
      # no `env_file`, and `.dockerignore` keeps `apps/api/.env` out of the
      # image. Each of these is something deploy/README.md tells an operator
      # to set, and setting it in `.env` did nothing while it was missing here.
      #
      # `APP_PREVIOUS_KEYS` is the one that could cost a journal. Rotation is
      # "old key here, new key in APP_KEY, run stillpoint:rotate-key, then
      # drop the old key". Without this line the command never saw the old
      # key, could read no row, and left every row as it was; dropping the old
      # key afterwards, as the procedure says to, would have left a database
      # nothing can decrypt.
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      # Which proxies to believe about the caller's address. Empty trusts
      # none, which is right while this nginx is the edge. See deploy/README.md.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Stillpoint}

  # Laravel's scheduler, which until now nothing ran.
  #
  # `deploy/README.md` listed "no queue, no scheduler" as a thing to fix before
  # this is in front of people. There are **two** scheduled tasks now, and this
  # comment said "the one scheduled task that exists" until the second was
  # counted: `sanctum:prune-expired` clears token rows that are already
  # refused, and `auth:clear-resets` clears password reset rows, which are
  # keyed by the **email address** and which nothing else touches. The first is
  # a table nobody tends; the second is somebody's address outliving a token
  # that stopped working.
  #
  # `ScheduledWorkHasSomethingToRunItTest` is what ties this service to
  # `routes/console.php`: the schedule is decoration without a runner, and the
  # runner is pointless without the schedule, and they are in different files.
  #
  # The same image as the API, so there is one thing to deploy rather than two
  # that can be deployed apart. It runs no web server and publishes no port.
  scheduler:
    image: stillpoint-api:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Stillpoint
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?set APP_KEY in .env — see deploy/README.md}
      # The same keys as the API, so that whatever this container is asked to
      # run by hand, `stillpoint:rotate-key` included, reads what the API reads.
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: ${DB_DATABASE:-stillpoint}
      DB_USERNAME: ${DB_USERNAME:-stillpoint}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stderr
    command: ['php', 'artisan', 'schedule:work']

  nginx:
    image: stillpoint-nginx:local
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${API_PORT:-8000}:80'
    # `/up` through nginx, which is the only check here that proves anything:
    # it answers only if nginx is up, PHP-FPM is reachable over FastCGI, and
    # the application boots. A check on php-fpm alone would have to speak
    # FastCGI; a check that the port is open would pass while the app was
    # broken.
    #
    # `wget` because nginx:alpine carries busybox and no curl, and `-q -O` in
    # particular because those are core busybox options — `--spider` is the
    # tidier spelling and not one I can verify from here. It exits non-zero on
    # an HTTP error either way, which is the whole requirement.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/up']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    image: stillpoint-web:local
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        # Read by the browser, so it is fixed when the image is built. Change
        # it and the image has to be rebuilt — there is no runtime override.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    # Healthy, not merely started. `depends_on` without a condition waits for
    # the container to exist, which for nginx is well before it can answer —
    # so `compose up` used to report everything up while the API was still
    # booting, and the first person to load the app got an error.
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/welcome']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  mysql:
