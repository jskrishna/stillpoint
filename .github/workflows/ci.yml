name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — PHP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    # The suite runs on sqlite for speed, but the schema is MySQL's to satisfy:
    # column types, index lengths and foreign keys differ. This service is what
    # actually verifies the migrations against the database we ship on — no
    # MySQL server is available in the development container.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stillpoint_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Booting the app needs an APP_KEY, which .env.example does not carry.
      # The domain tests do not boot it, but any feature test does.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Test
        run: ./vendor/bin/phpunit

      - name: Migrate against MySQL
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stillpoint_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Roll the migrations back, so down() is exercised too
        run: php artisan migrate:rollback --force --step=10
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stillpoint_test
          DB_USERNAME: root
          DB_PASSWORD: root

  check:
    name: JS — lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # CI builds the desktop app's main process and bundles the web app
          # into it; it never launches Electron, and there is no display to
          # launch it on. Downloading the 280 MB platform binary on every run
          # would be the slowest step here and buy nothing.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The web app consumes the workspace packages through node_modules, so
      # their built output must exist before lint and typecheck run.
      - name: Build packages
        run: pnpm run build:packages

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Every project: the packages, the Next.js app, and the mobile app — for
      # which `expo export` is a real build, bundling every module and
      # statically rendering each route. It is the only verification the
      # mobile app gets, since no simulator or device is attached to CI.
      - name: Build
        run: pnpm run build

  e2e:
    name: End to end — the real stack in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only worth the eight minutes once the cheap gates agree. A type error or a
    # red unit test fails these too, several minutes later and less legibly.
    needs: [api, check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, intl
          coverage: none

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install PHP dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      # sqlite on disk, not in memory: the suite's :memory: database belongs to
      # one process, and here the server and the browser are different ones.
      # The schema is MySQL's to satisfy and the `api` job is what proves that;
      # this job is about behaviour, not about the database.
      - name: Prepare the API
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          # Written into .env rather than exported, so every later step and the
          # server itself read the same database without anyone remembering to
          # pass it along.
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force

      # Only the packages and the web app. The mobile export and the desktop
      # bundle are the `check` job's to build, and neither is under test here.
      - name: Build the web app
        run: pnpm run build:packages && pnpm --filter @stillpoint/web run build

      # Playwright is a root dev dependency, and these scripts resolve it from
      # there. The development container has a browser at a fixed path instead
      # and blocks this download; `e2e/browser.mjs` tries both.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the servers
        run: |
          php artisan serve --port=8000 &
          echo $! > /tmp/api.pid
          pnpm --filter @stillpoint/web exec next start --port 3000 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8000/api/me || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:3000/welcome || true)
            # 401 from /api/me is the API answering, which is all this waits for.
            if [ "$api" = "401" ] && [ "$web" = "200" ]; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "servers did not come up (api=$api web=$web)"
          exit 1
        working-directory: apps/api

      # Four scripts, run whatever any one of them does: a failure in the
      # safety stop and a failure in the coach's sharing rule are different
      # news, and stopping at the first would hide the second.
      - name: The user journey, including the safety stop
        run: node e2e/flow.mjs

      - name: The console, and who may read a safety flag
        if: '!cancelled()'
        run: node e2e/admin.mjs

      - name: The coach portal, and what a coach cannot see
        if: '!cancelled()'
        run: node e2e/coach.mjs

      - name: WCAG 2.1 AA, every route, both palettes, two widths
        if: '!cancelled()'
        run: node e2e/a11y.mjs

      - name: Nothing leaves this origin
        if: '!cancelled()'
        run: node e2e/privacy.mjs

      - name: The API log, if anything failed
        if: failure()
        working-directory: apps/api
        run: tail -n 200 storage/logs/laravel.log || true

  docker:
    name: Deployment — the images build and come up
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built, not pushed. There is no registry and no release process yet;
      # what this job answers is whether `docker compose up` would work for
      # someone who cloned this, which was not true until it ran.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: false
          load: true
          tags: stillpoint-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: false
          load: true
          tags: stillpoint-nginx:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          load: true
          tags: stillpoint-web:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves the images exist; this proves they start, that the
      # migrations run against the MySQL they will meet, and that the API and
      # the web app each answer a request. A stack that builds and does not
      # come up is the failure this is here to catch.
      - name: Bring the stack up
        run: |
          cat > .env <<'ENV'
          # A real 32-byte key, because Laravel will not boot without one. It
          # is in the repository on purpose and must never be used anywhere
          # else: it encrypts an ephemeral database that is thrown away when
          # this job ends.
          APP_KEY=base64:Xgdsl6u1Rncati1S3SjwwbZ4AcJBUOBwyFGiipytm7Y=
          WEB_URL=http://localhost:3000
          API_URL=http://localhost:8000
          PUBLIC_API_URL=http://localhost:8000/api
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          DB_DATABASE=stillpoint
          DB_USERNAME=stillpoint
          DB_PASSWORD=ci-only-not-a-secret
          DB_ROOT_PASSWORD=ci-only-not-a-secret
          WEB_PORT=3000
          API_PORT=8000
          MAIL_MAILER=log
          ENV
          # The three images are already built and tagged above; compose
          # reuses them because the services name those tags.
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:8000/api/me || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:3000/welcome || true)
            # 401 from /api/me is the API answering through nginx and PHP-FPM.
            if [ "$api" = "401" ] && [ "$web" = "200" ]; then echo "up"; break; fi
            sleep 5
          done
          test "$api" = "401" || { echo "the API did not answer (got $api)"; exit 1; }
          test "$web" = "200" || { echo "the web app did not answer (got $web)"; exit 1; }
          # The migrations against the MySQL the compose file actually starts.
          docker compose exec -T api php artisan migrate --force

      - name: What the containers said, if anything failed
        if: failure()
        run: docker compose logs --tail 120
