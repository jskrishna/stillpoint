name: CI

# `push` only, deliberately. With `pull_request` as well, every commit on a
# branch that has an open pull request ran this whole workflow **twice** — two
# runs of four jobs, including the eight-minute browser check and three Docker
# builds — and the `concurrency` group below could not collapse them, because
# `github.ref` is `refs/heads/<branch>` for one event and `refs/pull/N/merge`
# for the other.
#
# Nothing is lost by dropping it: a push-triggered check run is associated with
# the pull request anyway, so the PR shows exactly these four checks. Verified
# rather than assumed — a push run's check arrived reported against the open PR.
#
# What it would cost is a pull request from a **fork**, where `push` does not
# fire in this repository. There are none; if that changes, add
# `pull_request:` back and expect the duplication with it.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Successive pushes to one branch: the newer run cancels the older, because
# there is no point finishing a run for a commit nobody is on any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — PHP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    # The suite runs on sqlite for speed, but the schema is MySQL's to satisfy:
    # column types, index lengths and foreign keys differ. This service is what
    # actually verifies the migrations against the database we ship on — no
    # MySQL server is available in the development container.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stillpoint_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Booting the app needs an APP_KEY, which .env.example does not carry.
      # The domain tests do not boot it, but any feature test does.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Test
        run: ./vendor/bin/phpunit

      - name: Migrate against MySQL
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stillpoint_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Roll the migrations back, so down() is exercised too
        run: php artisan migrate:rollback --force --step=10
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stillpoint_test
          DB_USERNAME: root
          DB_PASSWORD: root

  check:
    name: JS — lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # CI builds the desktop app's main process and bundles the web app
          # into it; it never launches Electron, and there is no display to
          # launch it on. Downloading the 280 MB platform binary on every run
          # would be the slowest step here and buy nothing.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The web app consumes the workspace packages through node_modules, so
      # their built output must exist before lint and typecheck run.
      - name: Build packages
        run: pnpm run build:packages

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Every project: the packages, the Next.js app, and the mobile app — for
      # which `expo export` is a real build, bundling every module and
      # statically rendering each route. It is the only verification the
      # mobile app gets, since no simulator or device is attached to CI.
      - name: Build
        run: pnpm run build

  e2e:
    name: End to end — the real stack in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only worth the eight minutes once the cheap gates agree. A type error or a
    # red unit test fails these too, several minutes later and less legibly.
    needs: [api, check]

    # MySQL, not sqlite, and this job is the one place it matters for behaviour
    # rather than for the schema.
    #
    # `php artisan serve` is PHP's built-in server, which answers one connection
    # at a time, and a browser holds several open on keep-alive: the API stopped
    # answering mid-run and every script inside that window failed with
    # `Failed to fetch`. The fix is `PHP_CLI_SERVER_WORKERS`, which means
    # several processes against one database — and on sqlite that is an
    # immediate `database is locked`, because two deferred transactions cannot
    # both upgrade to a write and `transaction_mode` needs PHP 8.4.
    #
    # It also makes the job prove more than it did. `lockForUpdate()` is a no-op
    # on sqlite, so the lock that stops a second turn landing on a session that
    # has already stopped for safety was not actually being exercised by the one
    # check that drives a real browser. Here it is.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stillpoint_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3, intl
          coverage: none

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install PHP dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the API
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          # Written into .env rather than exported, so every later step and the
          # server's worker processes read the same database without anyone
          # remembering to pass it along.
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=stillpoint_e2e|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=root|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=root|' .env
          php artisan migrate --force
          php artisan db:seed --force

      # Only the packages and the web app. The mobile export and the desktop
      # bundle are the `check` job's to build, and neither is under test here.
      #
      # `build`, not `build:standalone`: this job serves the app with
      # `next start`, which Next does not support alongside `output:
      # 'standalone'` and says so at every boot. The standalone output is the
      # desktop shell's and the Docker image's; see `apps/web/next.config.ts`.
      - name: Build the web app
        run: pnpm run build:packages && pnpm --filter @stillpoint/web run build

      # The mobile app's web export, which is how its screens get executed at
      # all. `expo export` already ran in the `check` job and proved every
      # route bundles and statically renders; this serves that output so a real
      # browser can drive it against the real API. Port 4000 is already in the
      # API's CORS list as "a static export's port".
      #
      # After the step above, not before: Metro resolves `@stillpoint/*`
      # through `node_modules` to their built output, so it needs
      # `build:packages` to have run.
      - name: Build the mobile app's web export
        run: pnpm --filter @stillpoint/mobile run build

      # Playwright is a root dev dependency, and these scripts resolve it from
      # there. The development container has a browser at a fixed path instead
      # and blocks this download; `e2e/browser.mjs` tries both.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `--no-reload` with workers, and both halves matter. `php artisan serve`
      # is PHP's built-in server, which handles **one connection at a time**;
      # a browser holds several open on keep-alive, so the API stopped
      # answering mid-run and the three scripts inside that window all failed
      # with `Failed to fetch`. Laravel only passes `PHP_CLI_SERVER_WORKERS`
      # through when reloading is off — without the flag it warns and serves
      # single-threaded anyway.
      #
      # Supervised, because workers raised that ceiling and did not remove it:
      # the server has since died outright part-way through a run. The
      # evidence was that `storage/logs/laravel.log` did not exist at all — so
      # nothing ever reached PHP and failed, the failures were at the
      # connection — and that `php` was absent from the runner's own list of
      # orphan processes at the end of the job, while `next-server` and
      # `python3` were still there. The last script then failed on every API
      # call and reported it as a UI timeout, which is a long way from the
      # cause.
      #
      # So it respawns, and says so loudly enough to find: a restart is
      # reported as a warning below rather than swallowed, because a server
      # that needs respawning is news whether or not the checks went green
      # around it. The alternative is nginx and php-fpm, which `deploy/`
      # already has and the `docker` job already brings up; that is the real
      # answer if this recurs.
      #
      # The cache is a file rather than the database for the same reason the
      # turns route has no throttle middleware, only smaller: `throttle:120,1`
      # writes a counter on every authenticated request, and with the cache in
      # the database every one of those writes competes with the data under
      # test. On sqlite that is fatal — measured, 2 of 10 role changes came
      # back 500 `database is locked`, from the rate limiter and not from
      # anything the request asked for.
      - name: Start the servers
        env:
          PHP_CLI_SERVER_WORKERS: '24'
          CACHE_STORE: file
        run: |
          nohup bash -c '
            for attempt in $(seq 1 50); do
              echo "--- starting the API (attempt $attempt) at $(date -Is)"
              php artisan serve --port=8000 --no-reload
              echo "!!! the API server exited ($?) at $(date -Is)"
              sleep 1
            done
          ' > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          pnpm --filter @stillpoint/web exec next start --port 3000 &
          echo $! > /tmp/web.pid
          python3 -m http.server 4000 --bind 127.0.0.1 \
            --directory "$GITHUB_WORKSPACE/apps/mobile/dist" > /tmp/mobile.log 2>&1 &
          echo $! > /tmp/mobile.pid
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8000/api/me || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:3000/welcome || true)
            mob=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:4000/ || true)
            # 401 from /api/me is the API answering, which is all this waits for.
            if [ "$api" = "401" ] && [ "$web" = "200" ] && [ "$mob" = "200" ]; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "servers did not come up (api=$api web=$web mobile=$mob)"
          exit 1
        working-directory: apps/api

      # Six scripts, run whatever any one of them does: a failure in the
      # safety stop and a failure in the coach's sharing rule are different
      # news, and stopping at the first would hide the second.
      - name: The user journey, including the safety stop
        run: node e2e/flow.mjs

      - name: The console, and who may read a safety flag
        if: '!cancelled()'
        run: node e2e/admin.mjs

      - name: The coach portal, and what a coach cannot see
        if: '!cancelled()'
        run: node e2e/coach.mjs

      - name: WCAG 2.1 AA, every route, both palettes, two widths
        if: '!cancelled()'
        run: node e2e/a11y.mjs

      - name: Nothing leaves this origin
        if: '!cancelled()'
        run: node e2e/privacy.mjs

      # The mobile app's own journey. Native modules are not covered and cannot
      # be here; `e2e/mobile.mjs` says exactly what that leaves.
      - name: The mobile app, actually running
        if: '!cancelled()'
        run: node e2e/mobile.mjs

      # A restart is not a failure on its own, so it does not fail the job —
      # but it is never invisible either, because the run it breaks is the one
      # after it and the symptom shows up somewhere else entirely.
      - name: Say so if the API server had to be restarted
        if: '!cancelled()'
        run: |
          deaths=$(grep -c '!!! the API server exited' /tmp/api.log || true)
          if [ "${deaths:-0}" -gt 0 ]; then
            echo "::warning::The API server died ${deaths} time(s) during this run and was restarted."
            grep -n 'starting the API\|the API server exited' /tmp/api.log || true
          else
            echo "The API server stayed up for the whole run."
          fi

      # Both logs, and neither quietly. The previous version tailed only
      # Laravel's, whose *absence* was the finding — `|| true` swallowed
      # "No such file or directory" into a line nobody reads twice.
      - name: The logs, if anything failed
        if: failure()
        run: |
          echo "=== the API server's own output ==="
          tail -n 60 /tmp/api.log || echo "(no /tmp/api.log)"
          echo
          echo "=== Laravel's log ==="
          if [ -f apps/api/storage/logs/laravel.log ]; then
            tail -n 200 apps/api/storage/logs/laravel.log
          else
            echo "(no laravel.log — nothing reached PHP and threw; look at the"
            echo " server output above and at the connection, not at the app)"
          fi

  docker:
    name: Deployment — the stack comes up and serves a session
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # For `deploy/smoke.mjs` below, which is plain `fetch` and needs no
      # workspace install. Pinned so the job does not depend on whatever the
      # runner image happens to ship.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Built, not pushed. There is no registry and no release process yet;
      # what this job answers is whether `docker compose up` would work for
      # someone who cloned this, which was not true until it ran.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: false
          load: true
          tags: stillpoint-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: false
          load: true
          tags: stillpoint-nginx:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          load: true
          tags: stillpoint-web:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves the images exist; this proves they start, that the
      # migrations run against the MySQL they will meet, and that the API and
      # the web app each answer a request. A stack that builds and does not
      # come up is the failure this is here to catch.
      # Before the images, so that the diagnostic step below can read the
      # compose file even when a build fails. Without it `docker compose logs`
      # refuses to interpolate and reports a missing variable instead of the
      # failure anybody is actually looking for.
      - name: Write the environment
        run: |
          cat > .env <<'ENV'
          # A real 32-byte key, because Laravel will not boot without one. It
          # is in the repository on purpose and must never be used anywhere
          # else: it encrypts an ephemeral database that is thrown away when
          # this job ends.
          APP_KEY=base64:Xgdsl6u1Rncati1S3SjwwbZ4AcJBUOBwyFGiipytm7Y=
          WEB_URL=http://localhost:3000
          API_URL=http://localhost:8000
          PUBLIC_API_URL=http://localhost:8000/api
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          DB_DATABASE=stillpoint
          DB_USERNAME=stillpoint
          DB_PASSWORD=ci-only-not-a-secret
          DB_ROOT_PASSWORD=ci-only-not-a-secret
          WEB_PORT=3000
          API_PORT=8000
          MAIL_MAILER=log
          ENV

      - name: Bring the stack up
        run: |
          # The three images are already built and tagged above; compose
          # reuses them because the services name those tags.
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:8000/api/me || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:3000/welcome || true)
            # 401 from /api/me is the API answering through nginx and PHP-FPM.
            if [ "$api" = "401" ] && [ "$web" = "200" ]; then echo "up"; break; fi
            sleep 5
          done
          test "$api" = "401" || { echo "the API did not answer (got $api)"; exit 1; }
          test "$web" = "200" || { echo "the web app did not answer (got $web)"; exit 1; }
          # The migrations against the MySQL the compose file actually starts.
          docker compose exec -T api php artisan migrate --force

          # The scheduler, which publishes no port — so the wait loop above
          # cannot see it, and a container crash-looping on a missing
          # environment variable or an unreachable database would pass this job
          # in silence while neither cleanup task ever ran.
          #
          # Two checks, because "running" on its own is weak: a container that
          # has restarted is one that already failed, and `restart:
          # unless-stopped` hides that by bringing it back.
          # Failures here are `::error::` so they arrive as annotations. A
          # shell step that just exits 1 says "Process completed with exit code
          # 1" and nothing else, and the log it says it in is not always
          # reachable — which is the whole reason the end-to-end scripts report
          # this way.
          fail() { echo "::error title=Deployment::$1"; exit 1; }

          id=$(docker compose ps -q scheduler)
          test -n "$id" || fail "no scheduler container came up"
          info=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$id")
          state=${info%% *}
          restarts=${info##* }
          echo "scheduler: state=$state restarts=$restarts"
          test "$state" = running || fail "the scheduler is $state, not running"
          test "$restarts" = 0 || fail "the scheduler has restarted $restarts time(s)"


          # And that it can actually do the work, in that container, with that
          # environment and that database — which "running" does not prove.
          docker compose exec -T scheduler php artisan auth:clear-resets \
            || fail "the scheduler container cannot run auth:clear-resets"
          docker compose exec -T scheduler php artisan schedule:list \
            || fail "the scheduler container cannot list its tasks"

      # Building proves the images exist and the step above proves they start.
      # Neither is a session. This registers an account through nginx and
      # PHP-FPM against the MySQL the compose file started, consents, runs a
      # turn, then says something that must stop the session and asserts the
      # server stopped it and sent helplines — and erases the account again.
      #
      # It is the difference between "this will start" and "somebody can use
      # it", and until it ran, nothing in this repository proved the second one
      # about the deployment.
      #
      # It reports step 2 having no question as a note rather than a failure,
      # which is correct here: production publishes no protocol version by
      # itself, so a fresh stack has only the questions the designs specify.
      # That is item 4 in `LAUNCH.md`, not a broken deployment.
      - name: Does it serve a session
        run: node deploy/smoke.mjs http://localhost:8000/api

      - name: What the containers said, if anything failed
        if: failure()
        # Never let the diagnostic itself fail the job and bury the real error.
        run: docker compose logs --tail 120 || true
