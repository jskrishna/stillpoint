# nginx in front of PHP-FPM.
#
# It serves `public/` itself and hands everything else to the `api` container.
# Laravel's own front controller is `public/index.php` and nothing above
# `public/` is ever reachable — which is the whole reason this is not simply
# `php artisan serve`.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Never announce the version.
    server_tokens off;

    # A journal export is the largest thing this API returns. A request body
    # does not need to be anywhere near this large — and **do not lower it**,
    # which is the opposite of what that sentence used to invite.
    #
    # This is the one limit on a turn that the application cannot see. The
    # turns route carries no `max` on `utterance` on purpose: it used to be
    # `max:5000` and a 5,222-character outpouring ending in "I want to kill
    # myself" answered 422 and was never screened (see the root `CLAUDE.md`,
    # "Length is a storage bound, not a refusal"). nginx refusing a body with
    # 413 is that same refusal, one layer further out, where no test reaches
    # and the risk screen never runs.
    #
    # 12m is about 2,400 times the length that was actually the problem, so it
    # is not one today. Tightening it to something that sounds tidy is how it
    # would become one again. `deploy/php.ini`'s `post_max_size` is the same
    # number for the same reason, and the two have to move together.
    client_max_body_size 12m;

    # The security headers are **not** here any more, and that is deliberate.
    #
    # They were, and only here — so every other way of running this app
    # answered with none: the development container, the end-to-end stack, and
    # any deployment whose terminator is not this file. That is the same
    # one-place argument the repository makes about `describe()` and about
    # having one API client. `App\Http\Middleware\SecurityHeaders` sets them
    # now, with `Content-Security-Policy: default-src 'none'` which was in
    # neither place, and `ApiOriginIsLockedDownTest` pins them.
    #
    # Adding them back here would send each one twice: nginx's `add_header`
    # appends rather than replaces. If a future edge needs to assert them
    # itself, use `proxy_hide_header`/`more_clear_headers` first.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Laravel reads these to build the request URL behind a proxy.
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Nothing starting with a dot is ever served. `.env` lives one level above
    # `public/` and is unreachable anyway; this is the belt to that's braces.
    location ~ /\. {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
