; Production PHP, for the image in api.Dockerfile.

; An interpreter that re-parses Laravel on every request is the single biggest
; thing between this and a usable response time.
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
; The code in an image never changes under a running container, so there is
; nothing to re-check for.
opcache.validate_timestamps=0

; Never tell a client what version of PHP this is.
expose_php=Off

; Session text is not large, but a journal export walks the whole journal.
memory_limit=256M
post_max_size=12M
upload_max_filesize=12M

; Errors go to the log, never to the response. A stack trace in a response body
; from this API would be a stack trace about somebody's session.
display_errors=Off
log_errors=On
error_log=/dev/stderr

; And no function arguments captured in those traces, for the same reason one
; line up. The turn loop passes the user's own words along as an argument —
; `Guide::respond($session, $version, $utterance)` — so every frame of a trace
; taken inside a turn holds the most personal text the product has.
;
; To be precise about what this does and does not buy, because the obvious
; reading is wrong: PHP's own `getTraceAsString()` renders a string argument as
; `'...'` whatever this is set to, and that is what Laravel's log formatter
; uses, so the application log does not carry those values today either way.
; What reads the *structured* trace, and would get the real values, is an error
; reporter — Sentry, Flare, anything of that shape — which is a thing that gets
; added later by somebody who is not thinking about this file.
;
; So: PHP's default since 7.4, set explicitly, because a deployment carrying
; this much personal text should not rely on a default for it, and because
; turning it off is the obvious move while debugging.
zend.exception_ignore_args=On
