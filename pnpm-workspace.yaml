packages:
  - 'packages/*'
  # Listed one by one rather than as apps/*: apps/api is a PHP project and
  # ships a package.json for Laravel's Vite scaffolding, which this API does
  # not use — Next.js is the frontend. Globbing pulled those dependencies into
  # the install.
  - 'apps/web'
  - 'apps/mobile'
  - 'apps/desktop'

# pnpm 10 does not run a dependency's install scripts unless it is listed here,
# which is the right default: an install script is arbitrary code from the
# registry. Electron's fetches the platform binary, without which `electron .`
# has nothing to run.
onlyBuiltDependencies:
  - electron
